version: '3.8'

services:
  payagent-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payagent-os-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PAYPAL_MODE=mock
      - PAYPAL_MOCK_DELAY_MS=200
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
